version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # grammers crates are released in lockstep and share types; bumping one
      # alone splits the lockfile and breaks the build.
      grammers:
        patterns: ["grammers-*"]
      # One PR per week for routine bumps instead of a flood
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
